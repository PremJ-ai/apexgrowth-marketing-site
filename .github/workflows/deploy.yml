name: Deploy ApexGrowth to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify site files, paths and JavaScript
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f .nojekyll
          grep -q 'href="./styles.css"' index.html
          grep -q 'src="./script.js"' index.html
          node --check script.js

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html styles.css script.js .nojekyll _site/

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
