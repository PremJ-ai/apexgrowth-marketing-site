name: Deploy ApexGrowth to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Extract website source archive
        run: |
          test -f apexgrowth-website-github-actions.zip
          mkdir -p extracted _site
          unzip -q apexgrowth-website-github-actions.zip -d extracted
          test -f extracted/apexgrowth-website/index.html
          cp -a extracted/apexgrowth-website/. _site/
          rm -rf _site/.github _site/README.md

      - name: Verify site files and relative paths
        run: |
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/.nojekyll
          grep -q 'href="./styles.css"' _site/index.html
          grep -q 'src="./script.js"' _site/index.html

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
